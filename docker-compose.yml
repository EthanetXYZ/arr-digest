services:
  arr-digest:
    image: ghcr.io/ethanetxyz/arr-digest:latest
    # To build from this checkout instead of pulling, comment out `image`
    # above, uncomment `build`, and run `docker compose up -d --build`.
    # build: .
    container_name: arr-digest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Etc/UTC
